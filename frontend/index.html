<!DOCTYPE html>
<html>
<head>
<title>Character AI Chatbot</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
display:flex;
flex-direction:column;
align-items:center;
margin-top:40px;
}

h1{
color:#38bdf8;
}

.chatbox{
width:500px;
height:400px;
background:#1e293b;
border-radius:10px;
padding:10px;
overflow-y:auto;
margin-bottom:10px;
}

.user{
color:#38bdf8;
}

.bot{
color:#22c55e;
}

input,select,button{
padding:10px;
margin:5px;
border-radius:5px;
border:none;
}

button{
background:#38bdf8;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<h1>Character AI Chatbot</h1>

<select id="character">
<option>Tony Stark</option>
<option>Sherlock Holmes</option>
<option>Yoda</option>
<option>Hermione Granger</option>
</select>

<div class="chatbox" id="chatbox"></div>

<input id="message" placeholder="Type your message..." style="width:300px">

<button onclick="sendMessage()">Send</button>

<script>

async function sendMessage(){

const message = document.getElementById("message").value
const character = document.getElementById("character").value
const chatbox = document.getElementById("chatbox")

chatbox.innerHTML += `<p class="user">You: ${message}</p>`

const response = await fetch("http://127.0.0.1:8000/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
character:character,
message:message
})
})

const data = await response.json()

chatbox.innerHTML += `<p class="bot">${character}: ${data.reply}</p>`

document.getElementById("message").value=""

chatbox.scrollTop = chatbox.scrollHeight

}

</script>

</body>
</html>
